<!DOCTYPE html>
<html>
<head>
<title>CreepyStories</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body {
font-family: arial;
background-color: white;
color: black;
margin: 20px;
}
input, select, textarea {
display: block;
margin-bottom: 10px;
width: 300px;
border: 1px solid black;
background: white;
color: black;
}
button {
border: 1px solid black;
background: white;
color: black;
cursor: pointer;
}
.page {
display: none;
}
.story-box {
border: 1px solid black;
margin-bottom: 10px;
padding: 10px;
cursor: pointer;
}
</style>
</head>
<body>

<h3>Where u can make YOUR Scary Stores!</h3>

<div id="authPage" class="page" style="display:block;">
<h4>Login</h4>
<input type="text" id="nameIn" placeholder="Username (letters, numbers, _ only)">
<input type="password" id="passIn" placeholder="Password">
<button onclick="login()">Login</button>
<br><br>
<h4>Make Account</h4>
<input type="text" id="nameIn2" placeholder="Username (letters, numbers, _ only)">
<input type="password" id="passIn2" placeholder="Password">
<button onclick="signup()">Signup</button>
</div>

<div id="mainPage" class="page">
<button onclick="logout()">Logout</button>
<button onclick="showPage('createPage')">Write Story</button>
<button onclick="showPage('profilePage')">Profile</button>
<h4>Stories</h4>
<div id="storyList"></div>
</div>

<div id="createPage" class="page">
<button onclick="showPage('mainPage')">Back</button>
<h4>Make Creepy Story</h4>
<input type="text" id="storyTitle" placeholder="Title">
<textarea id="storyText" rows="10" placeholder="Story text"></textarea>

<select id="tag1">
<option value="">Horror Level</option>
<option value="#MildHorror">#MildHorror</option>
<option value="#MediumHorror">#MediumHorror</option>
<option value="#SevereHorror">#SevereHorror</option>
</select>

<select id="tag2">
<option value="">Genre</option>
<option value="#Paranormal">#Paranormal</option>
<option value="#Metaphorical">#Metaphorical</option>
<option value="#FirstPerson">#FirstPerson</option>
<option value="#ThirdPerson">#ThirdPerson</option>
<option value="#Occult">#Occult</option>
<option value="#SciFi">#SciFi</option>
<option value="#Supernatural">#Supernatural</option>
<option value="#FoundFootage">#FoundFootage</option>
<option value="#PlotTwist">#PlotTwist</option>
<option value="#Nonsensical">#Nonsensical</option>
<option value="#Mystery">#Mystery</option>
<option value="#Nightmare">#Nightmare</option>
<option value="#Derivative">#Derivative</option>
</select>

<select id="tag3">
<option value="">Length</option>
<option value="#ShortStory">#ShortStory</option>
<option value="#MediumStory">#MediumStory</option>
<option value="#LongStory">#LongStory</option>
</select>

<select id="tag4">
<option value="">Style</option>
<option value="#Cosmic">#Cosmic</option>
<option value="#Gothic">#Gothic</option>
<option value="#Bizarro">#Bizarro</option>
<option value="#Epistolary">#Epistolary</option>
<option value="#Crime">#Crime</option>
<option value="#WebHorror">#WebHorror</option>
</select>

<select id="storyFont">
<option value="arial">Arial</option>
<option value="times new roman">Times New Roman</option>
<option value="courier new">Courier New</option>
</select>

<input type="number" id="pageLength" placeholder="Page Height (px)" value="400">
<input type="color" id="storyBg" value="#ffffff">
<input type="color" id="storyTxt" value="#000000">

<button onclick="postStory()">Post</button>
</div>

<div id="readPage" class="page">
<button onclick="showPage('mainPage')">Back</button>
<div id="readContent"></div>
<h4>Rate</h4>
<div id="ratingBox"></div>
<button onclick="skipRating()">Skip</button>
<h4>Comments</h4>
<input type="text" id="commentInput" placeholder="Comment...">
<button onclick="postComment()">Post Comment</button>
<div id="commentList"></div>
</div>

<div id="profilePage" class="page">
<button onclick="showPage('mainPage')">Back</button>
<h4>Profile</h4>
<input type="text" id="pfpUrl" placeholder="PFP Image URL">
<input type="color" id="profileBg" value="#ffffff">
<input type="text" id="bannerUrl" placeholder="Banner Image URL">
<textarea id="bioText" placeholder="Bio"></textarea>
<input type="text" id="statusText" placeholder="Status (lasts 1 hour)">
<button onclick="saveProfile()">Save</button>
<button onclick="deleteStatus()">Delete Status</button>
<div id="profileDisplay"></div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyB111TO8XYZ2TGbNfwDcHw7GIVmziORwcI",
authDomain: "socreepy-e5738.firebaseapp.com",
projectId: "socreepy-e5738",
storageBucket: "socreepy-e5738.firebasestorage.app",
messagingSenderId: "399421809697",
appId: "1:399421809697:web:e282057ab25bdb94bbaf60",
measurementId: "G-QDL915B8JY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var currentUserData = null;
var currentStoryId = null;

if (localStorage.username) {
db.collection("users").doc(localStorage.username).get().then(function(doc) {
if (doc.exists) {
currentUserData = doc.data();
loadMain();
} else {
localStorage.removeItem("username");
}
});
}

function showPage(id) {
var pages = document.getElementsByClassName("page");
for (var i = 0; i < pages.length; i++) {
pages[i].style.display = "none";
}
document.getElementById(id).style.display = "block";
if (id === "mainPage") {
loadStories();
}
if (id === "profilePage") {
loadProfile();
}
}

function login() {
var username = document.getElementById("nameIn").value;
var password = document.getElementById("passIn").value;
db.collection("users").doc(username).get().then(function(doc) {
if (doc.exists && doc.data().pass === btoa(password)) {
localStorage.username = username;
currentUserData = doc.data();
loadMain();
} else {
alert("wrong name or pass");
}
});
}

function signup() {
var username = document.getElementById("nameIn2").value;
var password = document.getElementById("passIn2").value;
var validUser = /^[a-zA-Z0-9_]+$/.test(username);
if (!validUser || username.length < 1) {
alert("Bad username");
return;
}
if (!password) {
alert("need password");
return;
}
db.collection("users").doc(username).get().then(function(doc) {
if (doc.exists) {
alert("name taken");
} else {
var role = "user";
if (username === "bartelsfamily5") {
role = "admin";
}
db.collection("users").doc(username).set({
username: username,
role: role,
pass: btoa(password),
pfp: "",
profileBg: "#ffffff",
banner: "",
bio: "",
status: "",
statusTime: 0
}).then(function() {
localStorage.username = username;
currentUserData = { username: username, role: role, pass: btoa(password), pfp: "", profileBg: "#ffffff", banner: "", bio: "", status: "", statusTime: 0 };
loadMain();
});
}
});
}

function logout() {
localStorage.removeItem("username");
currentUserData = null;
showPage("authPage");
}

function loadMain() {
showPage("mainPage");
}

function loadStories() {
document.getElementById("storyList").innerHTML = "";
db.collection("stories").orderBy("time", "desc").get().then(function(snap) {
snap.forEach(function(doc) {
var d = doc.data();
var div = document.createElement("div");
div.className = "story-box";
div.innerHTML = "<b>" + d.title + "</b> <br> " + d.tag1 + " " + d.tag2 + " " + d.tag3 + " " + d.tag4;
div.onclick = function() { openStory(doc.id); };
document.getElementById("storyList").appendChild(div);
});
});
}

function postStory() {
var title = document.getElementById("storyTitle").value;
var text = document.getElementById("storyText").value;
var tag1 = document.getElementById("tag1").value;
var tag2 = document.getElementById("tag2").value;
var tag3 = document.getElementById("tag3").value;
var tag4 = document.getElementById("tag4").value;
var font = document.getElementById("storyFont").value;
var length = document.getElementById("pageLength").value;
var bg = document.getElementById("storyBg").value;
var txt = document.getElementById("storyTxt").value;

if (!title || !text) {
alert("Fill out fields");
return;
}

db.collection("stories").add({
title: title,
text: text,
tag1: tag1,
tag2: tag2,
tag3: tag3,
tag4: tag4,
font: font,
length: length,
bg: bg,
txt: txt,
authorId: localStorage.username,
authorName: localStorage.username,
time: Date.now()
}).then(function() {
document.getElementById("storyTitle").value = "";
document.getElementById("storyText").value = "";
showPage("mainPage");
});
}

function openStory(id) {
currentStoryId = id;
showPage("readPage");
db.collection("stories").doc(id).get().then(function(doc) {
var d = doc.data();
var box = document.getElementById("readContent");
box.style.fontFamily = d.font;
box.style.backgroundColor = d.bg;
box.style.color = d.txt;
box.style.height = d.length + "px";
box.style.overflow = "auto";
box.style.padding = "10px";
box.innerHTML = "<h3>" + d.title + "</h3><p>" + d.text.replace(/\n/g, "<br>") + "</p><small>By " + d.authorName + "</small>";
loadRating();
loadComments();
});
}

function loadRating() {
var box = document.getElementById("ratingBox");
box.innerHTML = "";
db.collection("stories").doc(currentStoryId).collection("ratings").doc(localStorage.username).get().then(function(doc) {
var currentRating = 0;
if (doc.exists) {
currentRating = doc.data().stars;
}
for (var i = 1; i <= 5; i++) {
var btn = document.createElement("button");
btn.innerText = i;
if (i === currentRating) {
btn.style.backgroundColor = "black";
btn.style.color = "white";
}
btn.onclick = (function(star) {
return function() { rateStory(star); };
})(i);
box.appendChild(btn);
}
});
}

function rateStory(star) {
db.collection("stories").doc(currentStoryId).collection("ratings").doc(localStorage.username).set({
stars: star
});
loadRating();
}

function skipRating() {
document.getElementById("ratingBox").innerHTML = "<small>Skipped</small>";
}

function postComment() {
var text = document.getElementById("commentInput").value;
if (!text) return;
db.collection("stories").doc(currentStoryId).collection("comments").add({
text: text,
author: localStorage.username,
time: Date.now()
}).then(function() {
document.getElementById("commentInput").value = "";
loadComments();
});
}

function loadComments() {
document.getElementById("commentList").innerHTML = "";
db.collection("stories").doc(currentStoryId).collection("comments").orderBy("time", "desc").get().then(function(snap) {
snap.forEach(function(doc) {
var d = doc.data();
var p = document.createElement("p");
p.innerText = d.author + ": " + d.text;
document.getElementById("commentList").appendChild(p);
});
});
}

function loadProfile() {
if (!currentUserData) return;
document.getElementById("pfpUrl").value = currentUserData.pfp || "";
document.getElementById("profileBg").value = currentUserData.profileBg || "#ffffff";
document.getElementById("bannerUrl").value = currentUserData.banner || "";
document.getElementById("bioText").value = currentUserData.bio || "";
document.getElementById("statusText").value = "";
renderProfileView();
}

function renderProfileView() {
var box = document.getElementById("profileDisplay");
box.style.backgroundColor = currentUserData.profileBg;
box.style.padding = "10px";
box.style.border = "1px solid black";
box.style.marginTop = "20px";

var statusHtml = "";
if (currentUserData.status && currentUserData.statusTime) {
if (Date.now() - currentUserData.statusTime < 3600000) {
statusHtml = "<br><small><i>Status: " + currentUserData.status + "</i></small>";
} else {
db.collection("users").doc(localStorage.username).update({
status: "",
statusTime: 0
});
currentUserData.status = "";
}
}

box.innerHTML = "<img src='" + (currentUserData.banner || "") + "' style='width:100%;height:50px;object-fit:cover;' onerror='this.style.display=\"none\"'>" +
"<img src='" + (currentUserData.pfp || "") + "' style='width:50px;height:50px;' onerror='this.style.display=\"none\"'>" +
"<br><b>" + currentUserData.username + " (" + currentUserData.role + ")</b>" +
statusHtml +
"<br><small>" + (currentUserData.bio || "") + "</small>";
}

function saveProfile() {
var pfp = document.getElementById("pfpUrl").value;
var bg = document.getElementById("profileBg").value;
var banner = document.getElementById("bannerUrl").value;
var bio = document.getElementById("bioText").value;
var status = document.getElementById("statusText").value;

var updates = {
pfp: pfp,
profileBg: bg,
banner: banner,
bio: bio
};

if (status) {
updates.status = status;
updates.statusTime = Date.now();
}

db.collection("users").doc(localStorage.username).update(updates).then(function() {
currentUserData.pfp = pfp;
currentUserData.profileBg = bg;
currentUserData.banner = banner;
currentUserData.bio = bio;
if (status) {
currentUserData.status = status;
currentUserData.statusTime = updates.statusTime;
}
renderProfileView();
alert("Saved");
});
}

function deleteStatus() {
db.collection("users").doc(localStorage.username).update({
status: "",
statusTime: 0
}).then(function() {
currentUserData.status = "";
currentUserData.statusTime = 0;
renderProfileView();
});
}
</script>
</body>
</html>
